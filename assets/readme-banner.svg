<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">ERROR404DTIR — software, systems, experiments</title>
  <desc id="d">Animated terminal-style banner: a shell prompt runs whoami and prints ERROR404DT, next to a glowing orbit graphic.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1e2e"/>
      <stop offset="1" stop-color="#11111b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#89b4fa"/>
      <stop offset=".5" stop-color="#cba6f7"/>
      <stop offset="1" stop-color="#f5c2e7"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#cba6f7" stop-opacity=".45"/>
      <stop offset="1" stop-color="#cba6f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#313244" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="320" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)" opacity=".35"/>

    <!-- window chrome -->
    <rect width="1200" height="40" fill="#181825"/>
    <circle cx="28" cy="20" r="6" fill="#f38ba8"/>
    <circle cx="50" cy="20" r="6" fill="#f9e2af"/>
    <circle cx="72" cy="20" r="6" fill="#a6e3a1"/>
    <text x="600" y="25" text-anchor="middle" fill="#6c7086" font-family="'JetBrains Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="13">matin@error404dt: ~</text>

    <!-- orbit graphic -->
    <g transform="translate(950 180)">
      <circle r="150" fill="url(#glow)"/>
      <g fill="none" stroke="#45475a">
        <circle r="70"/>
        <circle r="110" stroke-dasharray="4 8"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
        <circle cx="110" cy="0" r="6" fill="#89b4fa"/>
        <circle cx="-110" cy="0" r="4" fill="#f5c2e7"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="9s" repeatCount="indefinite"/>
        <circle cx="0" cy="-70" r="5" fill="#a6e3a1"/>
      </g>
      <circle r="38" fill="#1e1e2e" stroke="url(#accent)" stroke-width="3">
        <animate attributeName="r" values="36;41;36" dur="3s" repeatCount="indefinite"/>
      </circle>
      <text y="8" text-anchor="middle" fill="#cdd6f4" font-family="'JetBrains Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="22" font-weight="700">404</text>
    </g>

    <!-- terminal text -->
    <g font-family="'JetBrains Mono',Consolas,'DejaVu Sans Mono',monospace">
      <text x="64" y="98" font-size="20"><tspan fill="#a6e3a1">❯</tspan><tspan fill="#cdd6f4" dx="12">whoami</tspan></text>
      <text x="60" y="172" font-size="64" font-weight="800" fill="url(#accent)" letter-spacing="-1">ERROR404DT</text>
      <text x="64" y="214" font-size="17" fill="#a6adc8" letter-spacing="3">SOFTWARE · SYSTEMS · EXPERIMENTS</text>
      <text x="64" y="266" font-size="18"><tspan fill="#a6e3a1">❯</tspan><tspan fill="#6c7086" dx="12"># limits: not found</tspan></text>
      <rect x="304" y="251" width="11" height="20" fill="#cdd6f4">
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
    <path d="M64 232H640" stroke="url(#accent)" stroke-width="2" stroke-linecap="round" stroke-dasharray="576" stroke-dashoffset="576">
      <animate attributeName="stroke-dashoffset" values="576;0;0" keyTimes="0;.4;1" dur="5s" repeatCount="indefinite"/>
    </path>
  </g>
  <rect x=".5" y=".5" width="1199" height="319" rx="20" fill="none" stroke="#313244"/>
</svg>
